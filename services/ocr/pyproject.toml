[project]
name = "redsky-ocr"
version = "0.2.0"
description = "RedSky document OCR and extraction service"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
# Exact pins live in requirements.lock (compiled with hashes); these are the
# direct dependencies only. `docling` itself is deliberately not listed: it
# pulls docling-slim[standard], which installs RapidOCR (PaddleOCR models).
dependencies = [
  "docling-slim[convert-core,format-pdf,format-office]==2.135.0",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",
  "pydantic-settings>=2.3,<3",
  "pypdfium2>=4.30,<6",
  "pillow>=10,<13",
  "boto3==1.43.109",
]

[project.optional-dependencies]
# Docling layout analysis and TableFormer. torch/torchvision are installed
# separately from the PyTorch CPU index (see Dockerfile) to avoid CUDA wheels.
models = [
  "docling-slim[models-local]==2.135.0",
]
# Granite Docling run inside this service. Not the `vlm` extra: that also
# installs qwen-vl-utils, which only Docling's Qwen-based extractors use.
granite = [
  "transformers>=4.42,<6",
  "accelerate>=1.2.1,<2",
]
dev = [
  "pytest==9.1.1",
  "reportlab==5.0.1",
  "moto[s3]==5.2.3",
]

[project.scripts]
redsky-ocr = "redsky_ocr.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redsky_ocr = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "docling_models: needs the Docling layout and table models on disk",
]
