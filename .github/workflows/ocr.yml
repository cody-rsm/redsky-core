name: OCR service

on:
  pull_request:
    paths:
      - 'services/ocr/**'
      - '.github/workflows/ocr.yml'
  push:
    branches: [main, staging]
    paths:
      - 'services/ocr/**'
      - '.github/workflows/ocr.yml'

permissions:
  contents: read

concurrency:
  group: ocr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/ocr
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      # The locked, hashed dependencies the image ships, plus the test tools.
      - name: Install dependencies
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --no-deps --require-hashes -r requirements-dev.lock
          .venv/bin/pip install --no-deps -e .
          .venv/bin/pip check
      - name: Dependency policy
        run: .venv/bin/python -c "from redsky_ocr import policy; policy.enforce(None); print('no forbidden packages')"
      - name: Test
        env:
          REDSKY_OCR_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: .venv/bin/pytest
